<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8">
    <title>Good Janet Chat Bot</title>
</head>
<body>

    <div class="chat-box">
        <div class="chat-header">Good Janet</div>
        
        <div class="chat-messages" id="messages">
            <div class="message bot-message">Hi there! How can I help you?</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type here...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

</body>
